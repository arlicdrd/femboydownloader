name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.7 (wrapper fallback)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] && ! command -v gradle >/dev/null 2>&1; then
            curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q /tmp/gradle.zip -d /tmp
            echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi
        working-directory: ytmusic-downloader

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ytmusic-downloader

      - name: Build Debug APK
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi
        working-directory: ytmusic-downloader

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ytmusic-downloader/app/build/outputs/apk/debug/app-debug.apk
